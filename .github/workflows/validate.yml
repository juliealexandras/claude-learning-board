name: Validate cards

on:
  pull_request:
    paths: ["cards.js", "scripts/validate-cards.mjs"]
  push:
    branches: [main]
    paths: ["cards.js", "scripts/validate-cards.mjs"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate-cards.mjs
