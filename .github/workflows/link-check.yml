name: Check links

# Runs every Monday and on demand. Opens or updates one issue when a link breaks.
on:
  schedule:
    - cron: "17 16 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links in cards and docs
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200..=299,403,429
            cards.js README.md CONTRIBUTING.md
          output: ./lychee-report.md
          fail: false

      - name: Open or update the broken links issue
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Broken links found"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file ./lychee-report.md
          else
            gh issue create --title "$title" --body-file ./lychee-report.md
          fi
